        window.__showExistingTableMapping = (options = {}) => {

                { name: 'Required Note', dataType: 'NVARCHAR(50)', nullable: false, hasDefault: false },
            ];
            const mappedColumns = columns.map(column => {
                if (column.sourceIndex === 0) {
                    return { ...column, targetName: 'Product Key' };
                }
                if (column.sourceIndex === 1 && options.mapRequiredNote) {
                    return { ...column, targetName: 'Required Note' };
                }
                if (column.sourceIndex === 2) {
                    return { ...column, targetName: 'Movement Date' };
                }
                if (column.sourceIndex === 3) {
                    return { ...column, targetName: 'Unit Cost' };
                }
                return { ...column, included: false };
            });

                type: 'sessionInitialized',
                state: {
                    ...baseState,
                    createTable: false,
                    invalidRowMode: options.invalidRowMode ?? 'abort',
                    hasValidationErrors: Boolean(options.hasValidationErrors),
                    existingTable: { status: 'ready', columns: targetColumns },
