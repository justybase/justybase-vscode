    <script>
        // VS Code sets theme variables on <html> and the theme class on <body>.
        var themeClass = location.search.indexOf('theme=light') >= 0 ? 'vscode-light' : 'vscode-dark';
        document.documentElement.classList.add(themeClass);
        document.addEventListener('DOMContentLoaded', function () {
            document.body.classList.add(themeClass);
        });
        window.__posted = [];
        window.acquireVsCodeApi = function () {
            return {
                postMessage: function (message) {
                    window.__posted.push(message);
                    var reply = function (data) { setTimeout(function () { window.postMessage(data, '*'); }, 30); };
                    if (message.command === 'requestDdl') {
                        reply({ command: 'setDdl', ddl: 'CREATE TABLE JUST_DATA.ADMIN.CUSTOMER_ORDERS\n(\n    CUSTOMER_ID INTEGER NOT NULL,\n    NAME VARCHAR(100) NOT NULL,\n    EMAIL VARCHAR(255),\n    BALANCE NUMERIC(12,2) DEFAULT 0,\n    CREATED_AT TIMESTAMP,\n    IS_ACTIVE BOOLEAN,\n    REGION_ID INTEGER,\n    NOTES VARCHAR(1000),\n    CONSTRAINT PK_CUSTOMER_ORDERS PRIMARY KEY (CUSTOMER_ID)\n)\nDISTRIBUTE ON (CUSTOMER_ID)\nORGANIZE ON (CREATED_AT);\n\n-- Table comment\nCOMMENT ON TABLE JUST_DATA.ADMIN.CUSTOMER_ORDERS IS \'Customer master with balances\';' });
                    } else if (message.command === 'previewSql') {
                        var c = message.changes, s = [];
                        if (c.deletes && c.deletes.length) s.push('DELETE FROM JUST_DATA.ADMIN.CUSTOMER_ORDERS WHERE ROWID IN (' + c.deletes.join(', ') + ')');
                        (c.updates || []).forEach(function (u) { s.push('UPDATE JUST_DATA.ADMIN.CUSTOMER_ORDERS SET ' + Object.keys(u.changes).map(function (k) { return k + " = '" + u.changes[k] + "'"; }).join(', ') + ' WHERE ROWID = ' + u.rowId); });
                        (c.inserts || []).forEach(function (i) { s.push('INSERT INTO JUST_DATA.ADMIN.CUSTOMER_ORDERS (' + Object.keys(i).join(', ') + ') VALUES (' + Object.keys(i).map(function (k) { return "'" + i[k] + "'"; }).join(', ') + ')'); });
                        reply({ command: 'sqlPreview', statements: s });
                    }
                },
                setState: function () {},
                getState: function () { return undefined; }
            };
        };
    </script>

<body>
    <!-- EDIT_DATA_SHELL:BEGIN (generated from renderEditDataShell, guarded by editDataPanelHarness.test.ts) -->
<div class="main-layout">

                            <button id="previewSqlBtn" title="Preview the SQL that Submit will run"><svg viewBox="0 0 16 16"><path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8 12.1 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></svg><span>Preview</span></button>

                            <button id="ddlOpenBtn" title="Open DDL in a SQL editor"><svg viewBox="0 0 16 16"><path d="M9 2.5h4.5V7M13.5 2.5L7.5 8.5"/><path d="M12 9.5v3a1 1 0 0 1-1 1H3.5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3"/></svg><span>Open in editor</span></button>
                        </div>
                    </div>
                    <div id="ddlContent" class="ddl-content"></div>
                </section>

    <script src="/dist/media/editDataPanel.js"></script>
    <script>
        (function () {
            var names = ['Anna Kowalska', 'Jan Nowak', 'Piotr Wójcik', 'Maria Wiśniewska', 'Tomasz Zieliński', 'Kasia Krawczyk', 'Michał Lewandowski', 'Agnieszka Kamińska'];
            var rows = [];
            var count = Number((location.search.match(/rows=(\d+)/) || [])[1] || 1200);
            for (var i = 0; i < count; i++) {
                var name = names[i % names.length];
                rows.push({
                    ROWID: 1700000 + i * 7,
                    CUSTOMER_ID: 10001 + i,
                    NAME: name,
                    EMAIL: i % 9 === 4 ? null : name.toLowerCase().replace(/[^a-z]+/g, '.') + '@example.com',
                    BALANCE: Math.round((Math.sin(i) + 1.2) * 482137) / 100,
                    CREATED_AT: '2026-' + String(1 + (i % 12)).padStart(2, '0') + '-' + String(1 + (i % 28)).padStart(2, '0') + ' 0' + (i % 10) + ':15:00',
                    IS_ACTIVE: i % 4 !== 1,
                    REGION_ID: i % 7 === 3 ? null : 1 + (i % 5),
                    NOTES: i % 3 === 0 ? null : (i % 5 === 0 ? 'VIP customer — contact account manager before changing credit limits' : 'Standard')
                });
            }
            var meta = {
                tableComment: 'Customer master with balances',
                columns: [
                    { ATTNAME: 'CUSTOMER_ID', FORMAT_TYPE: 'INTEGER', IS_NOT_NULL: 1, COLDEFAULT: null, DESCRIPTION: 'Business key', IS_PK: 1, IS_FK: 0 },
                    { ATTNAME: 'NAME', FORMAT_TYPE: 'VARCHAR(100)', IS_NOT_NULL: 1, COLDEFAULT: null, DESCRIPTION: '', IS_PK: 0, IS_FK: 0 },
                    { ATTNAME: 'EMAIL', FORMAT_TYPE: 'VARCHAR(255)', IS_NOT_NULL: 0, COLDEFAULT: null, DESCRIPTION: 'Primary contact', IS_PK: 0, IS_FK: 0 },
                    { ATTNAME: 'BALANCE', FORMAT_TYPE: 'NUMERIC(12,2)', IS_NOT_NULL: 0, COLDEFAULT: '0', DESCRIPTION: '', IS_PK: 0, IS_FK: 0 },
                    { ATTNAME: 'CREATED_AT', FORMAT_TYPE: 'TIMESTAMP', IS_NOT_NULL: 0, COLDEFAULT: 'NOW()', DESCRIPTION: '', IS_PK: 0, IS_FK: 0 },
                    { ATTNAME: 'IS_ACTIVE', FORMAT_TYPE: 'BOOLEAN', IS_NOT_NULL: 0, COLDEFAULT: null, DESCRIPTION: '', IS_PK: 0, IS_FK: 0 },
                    { ATTNAME: 'REGION_ID', FORMAT_TYPE: 'INTEGER', IS_NOT_NULL: 0, COLDEFAULT: null, DESCRIPTION: 'FK to REGIONS', IS_PK: 0, IS_FK: 1 },
                    { ATTNAME: 'NOTES', FORMAT_TYPE: 'VARCHAR(1000)', IS_NOT_NULL: 0, COLDEFAULT: null, DESCRIPTION: '', IS_PK: 0, IS_FK: 0 }
                ]
            };
            window.__editDataFixture = { rows: rows, meta: meta };
            window.__loadFixture = function (data) {
                window.postMessage({
                    command: 'setData',
                    data: data || rows,
                    columns: ['ROWID', 'CUSTOMER_ID', 'NAME', 'EMAIL', 'BALANCE', 'CREATED_AT', 'IS_ACTIVE', 'REGION_ID', 'NOTES'],
                    metadata: meta,
                    info: { rowLimit: 50000, elapsedMs: 184, tableName: 'JUST_DATA.ADMIN.CUSTOMER_ORDERS', connectionName: 'NZ_DEV' }
                }, '*');
                window.postMessage({ command: 'setLoading', loading: false }, '*');
            };
            window.addEventListener('load', function () { window.__loadFixture(); });
        })();
    </script>
