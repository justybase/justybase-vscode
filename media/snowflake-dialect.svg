<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title>Snowflake cloud data platform</title>
  <defs>
    <linearGradient id="snowflakeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#29b5e8" />
      <stop offset="100%" stop-color="#0073c0" />
    </linearGradient>
  </defs>
  <rect x="5" y="5" width="54" height="54" rx="13" fill="url(#snowflakeGradient)" />
  <!-- Geometric snowflake design -->
  <g fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" opacity="0.95">
    <!-- Center hexagon -->
    <circle cx="32" cy="32" r="3" fill="#fff" />
    <!-- Main vertical/horizontal lines -->
    <line x1="32" y1="12" x2="32" y2="52" />
    <line x1="12" y1="32" x2="52" y2="32" />
    <!-- Diagonal lines -->
    <line x1="18" y1="18" x2="46" y2="46" />
    <line x1="46" y1="18" x2="18" y2="46" />
    <!-- Short branches on main lines -->
    <line x1="32" y1="16" x2="26" y2="20" />
    <line x1="32" y1="16" x2="38" y2="20" />
    <line x1="32" y1="48" x2="26" y2="44" />
    <line x1="32" y1="48" x2="38" y2="44" />
    <line x1="16" y1="32" x2="20" y2="26" />
    <line x1="16" y1="32" x2="20" y2="38" />
    <line x1="48" y1="32" x2="44" y2="26" />
    <line x1="48" y1="32" x2="44" y2="38" />
  </g>
</svg>