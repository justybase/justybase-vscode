name: Web Shared workspace

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'test-harness/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-shared.yml'
  push:
    branches:
      - master
      - main
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'test-harness/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-shared.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Web Shared (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium (Linux)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright Chromium (Windows and macOS)
        if: runner.os != 'Linux'
        run: npx playwright install chromium

      - name: Run default Shared Web gate
        run: npm run test:playwright:web-shared

      - name: Upload Shared Web diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-shared-${{ matrix.os }}
          path: test-results/web-sql
          if-no-files-found: warn
          retention-days: 14
