name: Capture Visual Baselines

# Temporary one-off helper used to refresh the stale Result Panel screenshot
# baselines on the CI (Ubuntu) renderer. Remove after use.
on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:test-harness:shared-grid
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=test-harness/data-grid-visual.playwright.config.ts test-harness/tests/result-panel-parity.spec.ts --update-snapshots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-baselines
          path: test-harness/tests/__screenshots__/
