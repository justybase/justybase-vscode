name: DuckDB + File SQL Integration

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  duckdb-integration:
    name: DuckDB + File SQL Integration (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extensions/duckdb/package-lock.json

      - name: Install core dependencies
        run: npm ci

      - name: Install DuckDB optional extension dependencies
        working-directory: extensions/duckdb
        run: npm ci

      - name: Verify DuckDB type checks
        run: npm run check-types:duckdb

      - name: Build DuckDB extension
        run: npm run build:duckdb

      - name: Run DuckDB integration test
        run: npm run test:duckdb:integration

      - name: Run File SQL integration test
        run: npm run test:file:integration
