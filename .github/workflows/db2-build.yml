name: DB2 Extension Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The Db2 runtime is pure TypeScript and is bundled into extensions/db2/dist/extension.js,
  # so a single VSIX is valid on every platform. Do not reintroduce an OS matrix here:
  # extensions/db2/scripts/verify-vsix.js fails the package step if a native binary or a
  # duplicate @justybase/db2 copy ends up in the archive.
  build-db2:
    name: Build portable Db2 VSIX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extensions/db2/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Build shared workspace packages
        run: npm run build:designer-core && npm run build:shared-workspaces

      - name: Install Db2 extension dependencies
        run: npm run install:db2

      - name: Check types and build Db2 extension
        run: npm run check-types:db2 && npm run build:db2

      - name: Package and verify Db2 VSIX
        run: npm --prefix extensions/db2 run package -- --out justybaselite-db2.vsix

      - name: Upload Db2 VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: justybaselite-db2
          path: extensions/db2/justybaselite-db2.vsix
          retention-days: 1

  verify-vscode-runtime:
    name: Verify Db2 in VS Code ${{ matrix.vscode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vscode: ["1.103.2", stable, insiders]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extensions/db2/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Build shared workspace packages
        run: npm run build:designer-core && npm run build:shared-workspaces

      - name: Install Db2 extension dependencies
        run: npm run install:db2

      - name: Build Db2 extension
        run: npm run check-types:db2 && npm run build:db2

      - name: Run Extension Host driver smoke test
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npm run test:db2:vscode-runtime
        env:
          DB2_VSCODE_TEST_VERSION: ${{ matrix.vscode }}
