name: Build Portable Electron

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit to build."
        required: true
        default: master
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-portable:
    name: Build Windows x64 portable ZIP
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Electron tests and build
        run: npm run test:electron

      - name: Package portable Electron ZIP
        run: node scripts/package-electron-win.mjs

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: justybase-electron-win-x64
          path: artifacts/electron/justybase-electron-win-x64-*.zip
          if-no-files-found: error
          retention-days: 14
