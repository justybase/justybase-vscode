name: Db2 Live Validation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # Do not set DB2_LIVE_TEST_REQUIRED here: this runner has no always-on Db2.
  # Local `npm run test:db2:integration` sets REQUIRED=true. On Actions, live
  # tests run only when secrets are present (soft-skip otherwise).

jobs:
  db2-live:
    name: Db2 live suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extensions/db2/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install Db2 extension dependencies
        working-directory: extensions/db2
        run: npm ci

      - name: Align ibm_db to Node/Jest ABI
        run: npm run db2:runtime:node

      - name: Check root types
        run: npm run check-types

      - name: Lint root
        run: npm run lint

      - name: Verify Db2 extension
        run: npm run verify:db2

      - name: Build root
        run: npm run build

      - name: Run Db2 integration suite (soft-skip without secrets)
        env:
          DB2_LIVE_TEST_HOST: ${{ secrets.DB2_LIVE_TEST_HOST }}
          DB2_LIVE_TEST_PORT: ${{ secrets.DB2_LIVE_TEST_PORT }}
          DB2_LIVE_TEST_DATABASE: ${{ secrets.DB2_LIVE_TEST_DATABASE }}
          DB2_LIVE_TEST_USER: ${{ secrets.DB2_LIVE_TEST_USER }}
          DB2_LIVE_TEST_PASSWORD: ${{ secrets.DB2_LIVE_TEST_PASSWORD }}
          DB2_LIVE_TEST_CURRENT_SCHEMA: ${{ secrets.DB2_LIVE_TEST_CURRENT_SCHEMA }}
          DB2_LIVE_FIXTURE_SCHEMA: ${{ secrets.DB2_LIVE_FIXTURE_SCHEMA }}
        run: npm run test:db2:integration
