name: CI

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  docs:
    name: Documentation Portal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and check documentation
        run: npm run docs:check

  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extensions/*/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install ClickHouse extension dependencies
        if: hashFiles('extensions/clickhouse/package-lock.json') != ''
        working-directory: extensions/clickhouse
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate synchronized versions
        run: npm run version:check

      - name: Type check core
        run: npm run check-types

      - name: Check shared package boundaries
        run: npm run check:architecture

      - name: Type check shared packages and API
        run: npm run check-types:api

      - name: Type check web application
        run: npm run check-types:web

      - name: Type check DB2 extension
        if: hashFiles('extensions/db2/package-lock.json') != ''
        run: npm run check-types:db2

      - name: Type check DuckDB extension
        if: hashFiles('extensions/duckdb/package-lock.json') != ''
        run: npm run check-types:duckdb

      - name: Type check Oracle extension
        if: hashFiles('extensions/oracle/package-lock.json') != ''
        run: npm run check-types:oracle

      - name: Type check PostgreSQL extension
        if: hashFiles('extensions/postgresql/package-lock.json') != ''
        run: npm run check-types:postgresql

      - name: Type check Vertica extension
        if: hashFiles('extensions/vertica/package-lock.json') != ''
        run: npm run check-types:vertica

      - name: Type check MS SQL extension
        if: hashFiles('extensions/mssql/package-lock.json') != ''
        run: npm run check-types:mssql

      - name: Type check MySQL extension
        if: hashFiles('extensions/mysql/package-lock.json') != ''
        run: npm run check-types:mysql

      - name: Type check ClickHouse extension
        if: hashFiles('extensions/clickhouse/package-lock.json') != ''
        run: npm run check-types:clickhouse

      - name: Type check Snowflake extension
        if: hashFiles('extensions/snowflake/package-lock.json') != ''
        run: npm run check-types:snowflake

      - name: Lint
        run: npm run lint

      - name: Lint extended workspaces (ratchet)
        run: npm run lint:extended:check

      - name: Test quality tooling
        run: npm run test:quality-tools

      - name: Build desktop bundle
        run: npm run build

      - name: Build workspace products
        run: npm run build:all

  completion-parity:
    name: Completion Parity Gate
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extensions/*/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run completion parity tests
        run: npm run test:completion-parity

  quickfix-regression:
    name: Quick-Fix Regression Gate
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extensions/*/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run quick-fix regression tests
        run: npm run test:quickfix-regression

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extensions/*/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install ClickHouse extension dependencies
        if: hashFiles('extensions/clickhouse/package-lock.json') != ''
        working-directory: extensions/clickhouse
        run: npm ci

      - name: Install DuckDB extension dependencies
        if: hashFiles('extensions/duckdb/package-lock.json') != ''
        working-directory: extensions/duckdb
        run: npm ci

      - name: Install Access DuckDB runtime
        working-directory: extensions/access
        run: npm ci

      - name: Run complete root unit test suite with coverage
        run: npm run test:coverage

      - name: Enforce changed high-risk coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          diff_file="${RUNNER_TEMP}/justybase-changed.diff"
          git diff --unified=0 "${BASE_SHA}...HEAD" -- src > "${diff_file}"
          node scripts/quality-gate.mjs changed-coverage --diff-file="${diff_file}" --base="${BASE_SHA}"

      - name: Run API workspace tests
        run: npm run test:api

      - name: Run web workspace tests
        run: npm run test:web

  extension-host-result-panel:
    name: Extension Host Result Panel Gate
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run real VS Code result-panel scenario
        run: xvfb-run -a npm run test:extension-host

  local-integration:
    name: Local Runtime Integration (DuckDB / File SQL / Access)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extensions/duckdb/package-lock.json
            extensions/access/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install DuckDB extension dependencies
        working-directory: extensions/duckdb
        run: npm ci

      - name: Install Access extension dependencies
        working-directory: extensions/access
        run: npm ci

      - name: Run DuckDB integration tests
        run: npm run test:duckdb:integration

      - name: Run File SQL integration tests
        run: npm run test:file:integration

      - name: Run Access integration tests
        run: npm run test:access:integration

  access-java-crosscheck:
    name: Access Java Jackcess Cross-check
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extensions/access/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build the TypeScript writer
        run: npm run build --workspace packages/access-file

      - name: Verify a written file with Jackcess
        run: |
          node scripts/access-java-crosscheck.cjs

  parser-perf:
    name: Parser Construction Budget
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extensions/*/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Enforce parser construction budgets
        run: npm run test:parser-perf
